name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Self-contained builder image (JDK 17 + Android SDK) — the same Dockerfile
      # used for local builds. The YOLO model (kzkt.dat) is committed directly in
      # the repo, so no Git LFS setup is needed.
      - name: Build Docker image
        run: docker build -t kzkt-builder .

      # Reuse the Gradle dependency cache between runs (stored outside the image).
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: gradle-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Same commands as local Docker builds; app/build is bind-mounted so the
      # APK lands in the runner workspace for upload.
      - name: Unit tests + Debug APK (Docker)
        run: |
          mkdir -p gradle-cache
          docker run --rm \
            -v "$PWD/gradle-cache:/root/.gradle" \
            -v "$PWD/app/build:/app/app/build" \
            kzkt-builder ./gradlew testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kzkt-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
