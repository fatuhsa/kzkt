name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Self-contained builder image (JDK 17 + Android SDK) — the same Dockerfile
      # used for local builds. The YOLO model (kzkt.dat) is committed directly in
      # the repo, so no Git LFS setup is needed.
      - name: Build Docker image
        run: docker build -t kzkt-builder .

      # Reuse the Gradle dependency cache between runs (stored outside the image).
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: gradle-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Same commands as local Docker builds; app/build is bind-mounted so the
      # APK lands in the runner workspace for upload.
      - name: Unit tests + Debug APK (Docker)
        run: |
          mkdir -p gradle-cache
          # -PciDebug=true gives the debug APK its own applicationId (com.kzkt.app.debug,
          # label "KZKT Debug") so it installs alongside the release app without
          # conflicts — see the debug buildType in app/build.gradle.kts.
          docker run --rm \
            -v "$PWD/gradle-cache:/root/.gradle" \
            -v "$PWD/app/build:/app/app/build" \
            kzkt-builder ./gradlew testDebugUnitTest assembleDebug -PciDebug=true
          # The container writes as root, so hand ownership back to the runner
          # user — otherwise the actions/cache post-step can't read gradle-cache
          # (and to be safe, also fix app/build before artifact upload).
          sudo chown -R "$(id -u):$(id -g)" gradle-cache app/build

      - name: Upload debug APKs
        uses: actions/upload-artifact@v5
        with:
          name: kzkt-app-debug
          # Splits menghasilkan 1 APK per ABI + universal (tidak ada app-debug.apk lagi)
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
