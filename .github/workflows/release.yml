name: Auto Release

on:
  push:
    tags:
      - "v*"        # rilis otomatis saat tag v1.25.3 dst di-push
  workflow_dispatch:  # atau jalankan manual dari tab Actions
    inputs:
      version:
        description: "Versi untuk rilis manual (mis. 1.25.3). Kosongkan jika trigger via tag."
        required: false
        default: ""

permissions:
  contents: write    # untuk membuat GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ── Build image builder (sama dengan android.yml & build lokal) ──
      - name: Build Docker image
        run: docker build -t kzkt-builder .

      # ── Rekonstruksi keystore dari GitHub Secrets ──────────────────
      # Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Restore keystore from secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 kosong — isi 4 secret (KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD) di Settings → Secrets → Actions"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > kzkt-release.jks
          cat > keystore.properties <<EOF
          storeFile=/app/kzkt-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          ls -la kzkt-release.jks keystore.properties

      # ── Gradle cache (reuse antara run) ────────────────────────────
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: gradle-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Unit test + build release SIGNED (R8 + shrink) ────────────
      - name: Unit tests + Release APK (Docker)
        run: |
          mkdir -p gradle-cache
          docker run --rm \
            -v "$PWD/gradle-cache:/root/.gradle" \
            -v "$PWD/app/build:/app/app/build" \
            -v "$PWD/keystore.properties:/app/keystore.properties:ro" \
            -v "$PWD/kzkt-release.jks:/app/kzkt-release.jks:ro" \
            kzkt-builder ./gradlew testDebugUnitTest assembleRelease
          sudo chown -R "$(id -u):$(id -g)" gradle-cache app/build

      # ── Tentukan tag & versi tujuan release ────────────────────────
      - name: Resolve release tag & version
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            echo "::error::Rilis manual butuh input 'version' (mis. 1.25.3)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # ── Rename APK ke format Komikku + hitung sha256 ───────────────
      - name: Rename APKs & generate checksums
        run: |
          set -e
          cd app/build/outputs/apk/release
          ls -la
          V="${{ steps.tag.outputs.version }}"
          # Mapping nama output AGP → nama publik
          mv app-arm64-v8a-release.apk   "KZKT-arm64-v8a-v${V}.apk" 2>/dev/null || true
          mv app-armeabi-v7a-release.apk "KZKT-armeabi-v7a-v${V}.apk" 2>/dev/null || true
          mv app-x86-release.apk         "KZKT-x86-v${V}.apk" 2>/dev/null || true
          mv app-x86_64-release.apk      "KZKT-x86_64-v${V}.apk" 2>/dev/null || true
          mv app-universal-release.apk   "KZKT-v${V}.apk" 2>/dev/null || true
          echo "── File release: ──"
          ls -lh KZKT-*.apk
          sha256sum KZKT-*.apk | tee sha256sums.txt

      # ── Susun body release (daftar APK + sha256) ───────────────────
      # body_path butuh file markdown polos (bukan JSON)
      - name: Compose release body
        id: body
        run: |
          {
            echo "## 📦 APK"
            echo ""
            while read -r hash file; do
              size=$(du -h "app/build/outputs/apk/release/$file" | cut -f1)
              echo "- **\`$file\`** (${size})"
              echo "  sha256: \`$hash\`"
            done < app/build/outputs/apk/release/sha256sums.txt
            echo ""
            echo "Klik file di bawah untuk mengunduh, atau unduh via Telegram."
          } > /tmp/release-body.md
          cat /tmp/release-body.md

      # ── Buat GitHub Release + lampirkan semua APK ──────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            app/build/outputs/apk/release/KZKT-*.apk
            app/build/outputs/apk/release/sha256sums.txt
          name: KZKT ${{ steps.tag.outputs.tag }}
          body_path: /tmp/release-body.md
          generate_release_notes: true
          draft: true   # biar bisa review dulu sebelum publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── (Opsional) Kirim APK ke Telegram ───────────────────────────
      # Aktif hanya jika secrets TELEGRAM_BOT_TOKEN & TELEGRAM_CHAT_ID diisi.
      - name: Send APK to Telegram
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$TG_BOT" ] || [ -z "$TG_CHAT" ]; then
            echo "ℹ️ Telegram secrets belum diisi — lewati."
            exit 0
          fi
          # Kirim APK universal (paling berguna) + checksum
          APK=$(ls app/build/outputs/apk/release/KZKT-v*.apk | head -1)
          curl -s -F "chat_id=$TG_CHAT" \
            -F "document=@$APK" \
            -F "caption=📦 KZKT $TG_TAG — release baru! Semua varian APK ada di GitHub Releases (link di bawah)." \
            "https://api.telegram.org/bot$TG_BOT/sendDocument" \
            | grep -q '"ok":true' && echo "✅ APK terkirim ke Telegram" || echo "⚠️ Gagal kirim ke Telegram"
