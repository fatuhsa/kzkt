name: KZKT Auto Release

on:
  push:
    tags:
      - "v*"        # auto release when a tag like v1.25.3 is pushed
  workflow_dispatch:  # or run manually from the Actions tab
    inputs:
      version:
        description: "Version for the manual release (e.g. 1.25.3). Leave empty when triggering via a tag. The versionCode is derived from this automatically."
        required: false
        default: ""
      versionCode:
        description: "(Optional) Custom versionCode. Leave empty to auto-derive from the version name."
        required: false
        default: ""

permissions:
  contents: write    # to create the GitHub Release

jobs:
  # ── Job 1: prepare ──────────────────────────────────────────────
  # Resolve the tag & version, build the builder image once.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release tag & version
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            echo "::error::Manual release requires a 'version' input (e.g. 1.25.3)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # ── Jobs 2-6: matrix build (parallel, 1 job per ABI + universal) ────
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64, universal]
    steps:
      - uses: actions/checkout@v5

      # Each matrix job runs on a separate runner → build its own image.
      - name: Build Docker image
        run: docker build -t kzkt-builder .

      # Reconstruct the keystore from GitHub Secrets
      # Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Restore keystore from secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 is empty — set the 4 secrets (KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD) in Settings → Secrets → Actions"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > kzkt-release.jks
          cat > keystore.properties <<EOF
          storeFile=/app/kzkt-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # Gradle cache (shared across runs & jobs)
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: gradle-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Build a SIGNED release for one ABI (R8 + shrink)
      - name: Build APK (${{ matrix.abi }})
        run: |
          mkdir -p gradle-cache
          # universal → no ABI filter (all libs + universal APK)
          FLAG=""
          if [ "${{ matrix.abi }}" != "universal" ]; then
            FLAG="-PabiFilter=${{ matrix.abi }}"
          fi
          # Auto version bump: -PversionName comes from the input/tag.
          # -PversionCode is passed when the custom field is filled, otherwise let
          # build.gradle.kts derive it automatically from the version name.
          VERSION_ARGS="-PversionName=${{ needs.prepare.outputs.version }}"
          if [ -n "${{ github.event.inputs.versionCode }}" ]; then
            VERSION_ARGS="$VERSION_ARGS -PversionCode=${{ github.event.inputs.versionCode }}"
          fi
          docker run --rm \
            -v "$PWD/gradle-cache:/root/.gradle" \
            -v "$PWD/app/build:/app/app/build" \
            -v "$PWD/keystore.properties:/app/keystore.properties:ro" \
            -v "$PWD/kzkt-release.jks:/app/kzkt-release.jks:ro" \
            kzkt-builder ./gradlew assembleRelease $FLAG $VERSION_ARGS
          sudo chown -R "$(id -u):$(id -g)" gradle-cache app/build

      # Save the built APK (per ABI) so the release job can pick it up
      - name: Upload APK (${{ matrix.abi }})
        uses: actions/upload-artifact@v5
        with:
          name: kzkt-apk-${{ matrix.abi }}
          path: app/build/outputs/apk/release/app-${{ matrix.abi }}-release.apk
          if-no-files-found: error
          retention-days: 7

  # ── Job 7: combine all APKs → GitHub Release + Telegram ───────────
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Download all APKs from the build job (matrix)
      - name: Download all APKs
        uses: actions/download-artifact@v5
        with:
          pattern: kzkt-apk-*
          path: apks
          merge-multiple: true

      # Rename to Komikku-style format + compute sha256
      - name: Rename APKs & generate checksums
        run: |
          set -e
          cd apks
          ls -la
          V="${{ needs.prepare.outputs.version }}"
          mv app-arm64-v8a-release.apk   "KZKT-arm64-v8a-v${V}.apk"
          mv app-armeabi-v7a-release.apk "KZKT-armeabi-v7a-v${V}.apk"
          mv app-x86-release.apk         "KZKT-x86-v${V}.apk"
          mv app-x86_64-release.apk      "KZKT-x86_64-v${V}.apk"
          mv app-universal-release.apk   "KZKT-v${V}.apk"
          echo "── Release files: ──"
          ls -lh KZKT-*.apk
          sha256sum KZKT-*.apk | tee sha256sums.txt

      # Compose the release body: this version's CHANGELOG.md section + APK list + sha256.
      # The description ALWAYS comes from CHANGELOG.md — not commit history — so
      # generate_release_notes is off and the text is composed manually here.
      - name: Compose release body (from CHANGELOG.md)
        run: |
          V="${{ needs.prepare.outputs.version }}"
          # Extract the "## [vX.Y.Z]" section up to the next changelog header
          awk -v v="v$V" 'index($0, "## [" v "]") == 1 { flag=1; next } flag && /^## \[/ { exit } flag { print }' CHANGELOG.md > /tmp/changelog-section.md
          if [ ! -s /tmp/changelog-section.md ]; then
            echo "::warning::Section [v$V] not found in CHANGELOG.md — the body will only contain the APK list."
          fi
          {
            echo "# KZKT v$V"
            echo ""
            if [ -s /tmp/changelog-section.md ]; then
              cat /tmp/changelog-section.md
              echo ""
            fi
            echo "---"
            echo ""
            echo "## APK"
            echo ""
            while read -r hash file; do
              size=$(du -h "apks/$file" | cut -f1)
              echo "- **\`$file\`** (${size})"
              echo "  sha256: \`$hash\`"
            done < apks/sha256sums.txt
            echo ""
            echo "Click a file below to download, or grab it via Telegram."
            echo ""
            echo "---"
            echo ""
            echo "*Full changelog: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)*"
          } > /tmp/release-body.md
          cat /tmp/release-body.md

      # Create the GitHub Release + attach all APKs (no draft → published immediately)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            apks/KZKT-*.apk
            apks/sha256sums.txt
          name: KZKT ${{ needs.prepare.outputs.tag }}
          body_path: /tmp/release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # (Optional) Telegram notification — send message + release link.
      # APKs are NOT sent directly because the Telegram Bot API caps files
      # at 50 MB while the APK is > 100 MB.
      - name: Send release info to Telegram
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "$TG_BOT" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set — skipping."
            exit 0
          fi
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TG_TAG}"
          # printf turns \n into real newlines (not literal text)
          MSG=$(printf 'KZKT %s — new release!\n\nAll APK variants + sha256 are on GitHub Releases:\n%s\n\n(Pick KZKT-arm64-v8a-%s.apk for modern phones)' "$TG_TAG" "$RELEASE_URL" "$TG_TAG")
          curl -s -F "chat_id=$TG_CHAT" \
            -F "text=$MSG" \
            "https://api.telegram.org/bot$TG_BOT/sendMessage" \
            | grep -q '"ok":true' && echo "Telegram notification sent" || echo "Failed to send Telegram notification"
