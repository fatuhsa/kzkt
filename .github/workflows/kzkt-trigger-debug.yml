name: KZKT Trigger Debug

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Self-contained builder image (JDK 17 + Android SDK) — the same Dockerfile
      # used for local builds. The YOLO model (kzkt.dat) is committed directly in
      # the repo, so no Git LFS setup is needed.
      - name: Build Docker image
        run: docker build -t kzkt-builder .

      # Reuse the Gradle dependency cache between runs (stored outside the image).
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: gradle-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Same commands as local Docker builds; app/build is bind-mounted so the
      # APK lands in the runner workspace for upload.
      - name: Unit tests + Debug APK (Docker)
        run: |
          mkdir -p gradle-cache
          # -PciDebug=true gives the debug APK its own applicationId (com.kzkt.app.debug,
          # label "KZKT Debug") so it installs alongside the release app without
          # conflicts — see the debug buildType in app/build.gradle.kts.
          docker run --rm \
            -v "$PWD/gradle-cache:/root/.gradle" \
            -v "$PWD/app/build:/app/app/build" \
            kzkt-builder ./gradlew testDebugUnitTest assembleDebug -PciDebug=true
          # The container writes as root, so hand ownership back to the runner
          # user — otherwise the actions/cache post-step can't read gradle-cache
          # (and to be safe, also fix app/build before artifact upload).
          sudo chown -R "$(id -u):$(id -g)" gradle-cache app/build

      - name: Upload debug APKs
        uses: actions/upload-artifact@v5
        with:
          name: kzkt-app-debug
          # Splits menghasilkan 1 APK per ABI + universal (tidak ada app-debug.apk lagi)
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Notify Telegram with the artifact download links. Workflow artifacts have
      # no public URL on GitHub itself (login required), so also include a
      # nightly.link direct link — it serves artifacts of public repos without
      # authentication. Skipped when the Telegram secrets are unset.
      - name: Send debug APK link to Telegram
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets belum diisi — lewati."
            exit 0
          fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          DIRECT_URL="https://nightly.link/${GITHUB_REPOSITORY}/workflows/kzkt-trigger-debug.yml/${GITHUB_RUN_ID}/kzkt-app-debug.zip"
          # printf menerjemahkan \n jadi baris baru sungguhan (bukan teks literal)
          MSG=$(printf 'KZKT Debug build selesai!\n\nDownload artifact (perlu login GitHub):\n%s\n\nDownload langsung tanpa login (nightly.link):\n%s\n\nPilih KZKT-arm64-v8a (file app-arm64-v8a-debug.apk di dalam zip) untuk HP modern.' "$RUN_URL" "$DIRECT_URL")
          curl -s -F "chat_id=$TG_CHAT" \
            -F "text=$MSG" \
            "https://api.telegram.org/bot$TG_BOT/sendMessage" \
            | grep -q '"ok":true' && echo "Notifikasi terkirim ke Telegram" || echo "Gagal kirim ke Telegram"
