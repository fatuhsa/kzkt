name: KZKT Trigger Debug

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Self-contained builder image (JDK 17 + Android SDK) — the same Dockerfile
      # used for local builds. The YOLO model (kzkt.dat) is committed directly in
      # the repo, so no Git LFS setup is needed.
      - name: Build Docker image
        run: docker build -t kzkt-builder .

      # Reuse the Gradle dependency cache between runs (stored outside the image).
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: gradle-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Same commands as local Docker builds; app/build is bind-mounted so the
      # APK lands in the runner workspace for upload.
      - name: Unit tests + Debug APK (Docker)
        run: |
          mkdir -p gradle-cache
          # -PciDebug=true gives the debug APK its own applicationId (com.kzkt.app.debug,
          # label "KZKT Debug") so it installs alongside the release app without
          # conflicts — see the debug buildType in app/build.gradle.kts.
          docker run --rm \
            -v "$PWD/gradle-cache:/root/.gradle" \
            -v "$PWD/app/build:/app/app/build" \
            kzkt-builder ./gradlew testDebugUnitTest assembleDebug -PciDebug=true
          # The container writes as root, so hand ownership back to the runner
          # user — otherwise the actions/cache post-step can't read gradle-cache
          # (and to be safe, also fix app/build before artifact upload).
          sudo chown -R "$(id -u):$(id -g)" gradle-cache app/build

      # One artifact per ABI (like the release workflow) so each download is a
      # single APK — not one giant zip containing every variant. The universal
      # debug APK is deliberately skipped: unminified it is ~500 MB and debug
      # builds only target the developer's own device.
      # Short retention bounds the artifact storage: every push adds ~550 MB of
      # debug APKs, and with the default 90-day retention the account quota (500 MB
      # free / 1 GB Pro / 10 GB Team / 50 GB Enterprise) would fill quickly.
      - name: Upload debug APK (arm64-v8a)
        uses: actions/upload-artifact@v5
        with:
          name: kzkt-app-debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK (armeabi-v7a)
        uses: actions/upload-artifact@v5
        with:
          name: kzkt-app-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK (x86)
        uses: actions/upload-artifact@v5
        with:
          name: kzkt-app-debug-x86
          path: app/build/outputs/apk/debug/app-x86-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK (x86_64)
        uses: actions/upload-artifact@v5
        with:
          name: kzkt-app-debug-x86_64
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Notify Telegram with one download link per ABI. Workflow artifacts have
      # no public URL on GitHub itself (login required), so each link points to
      # nightly.link, which serves artifacts of public repos without auth.
      # Skipped when the Telegram secrets are unset.
      - name: Send debug APK links to Telegram
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets belum diisi — lewati."
            exit 0
          fi
          BASE="https://nightly.link/${GITHUB_REPOSITORY}/workflows/kzkt-trigger-debug.yml/${GITHUB_RUN_ID}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # printf menerjemahkan \n jadi baris baru sungguhan (bukan teks literal)
          MSG=$(printf 'KZKT Debug build selesai!\n\nDownload per ABI (tanpa login, via nightly.link):\n- arm64-v8a: %s/kzkt-app-debug-arm64-v8a.zip\n- armeabi-v7a: %s/kzkt-app-debug-armeabi-v7a.zip\n- x86: %s/kzkt-app-debug-x86.zip\n- x86_64: %s/kzkt-app-debug-x86_64.zip\n\nPilih arm64-v8a untuk HP modern (POCO F5).\nAlternatif (perlu login GitHub): %s' "$BASE" "$BASE" "$BASE" "$BASE" "$RUN_URL")
          curl -s -F "chat_id=$TG_CHAT" \
            -F "text=$MSG" \
            "https://api.telegram.org/bot$TG_BOT/sendMessage" \
            | grep -q '"ok":true' && echo "Notifikasi terkirim ke Telegram" || echo "Gagal kirim ke Telegram"
